
name: Build Roblox Studio AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download project files
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install Android SDK packages
      - name: Install SDK packages
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"

      # 6. Accept Android licenses
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # 7. Check Android project
      - name: Check project files
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found in project root"
            exit 1
          fi

          if [ ! -d "./app" ]; then
            echo "ERROR: app folder not found"
            exit 1
          fi

          chmod +x ./gradlew

      # 8. Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 9. Upload APK
      - name: Upload Roblox Studio AI APK
        uses: actions/upload-artifact@v4
        with:
          name: RobloxStudioAI-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
